services:
  - type: web
    name: jump-vpn-panel
    runtime: node
    plan: free
    rootDir: panel
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
