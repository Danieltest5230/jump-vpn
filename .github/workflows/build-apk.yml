name: Build Jump VPN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Compilar APK (Debug)
        run: |
          cd android
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log || {
            echo "::error::Fallo en la compilación de Gradle"
            grep -E "(e: |error:|FAILURE:|FAILED)" build.log | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Subir Log en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: android/build.log

      - name: Subir Artefacto APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jump-VPN-v4.6.2-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
