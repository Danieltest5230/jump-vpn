name: Build Jump VPN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Compilar APK (Debug)
        run: |
          cd android
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace > build.log 2>&1 || {
            echo "::error::Fallo en la compilación de Gradle"
            cat build.log | tail -n 120
            echo "### ⚠️ Error de Compilación Gradle" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Subir Artefacto APK
        uses: actions/upload-artifact@v4
        with:
          name: Jump-VPN-v4.6.2-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
